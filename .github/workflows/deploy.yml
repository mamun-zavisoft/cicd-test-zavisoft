name: Laravel CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.2

    - name: Copy .env
      run: cp .env.example .env

    - name: Create SQLite Database
      run: |
        mkdir -p database
        touch database/database.sqlite

    - name: Configure Environment
      run: |
        echo "DB_CONNECTION=sqlite" >> .env
        echo "DB_DATABASE=$(pwd)/database/database.sqlite" >> .env
        echo "CACHE_STORE=file" >> .env
        echo "SESSION_DRIVER=file" >> .env
        echo "QUEUE_CONNECTION=sync" >> .env

    - name: Install Dependencies
      run: composer install --no-interaction --prefer-dist

    - name: Generate App Key
      run: php artisan key:generate

    - name: Clear Caches
      run: |
        php artisan config:clear
        php artisan cache:clear
        php artisan route:clear
        php artisan view:clear

    - name: Set Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Run Database Migrations
      run: php artisan migrate --force

    - name: Run Tests
      run: |
        php artisan test | tee test-results.txt

    - name: Upload Test Artifact
      uses: actions/upload-artifact@v4
      with:
        name: laravel-test-results
        path: test-results.txt

    deploy:
      name: Deploy Laravel App
      runs-on: [self-hosted]

      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Set Variables
          run: |
            echo "APP_DIR=/var/www/auto-clinic" >> $GITHUB_ENV
            echo "REPO_URL=https://github.com/mamun-zavisoft/cicd-test-zavisoft.git" >> $GITHUB_ENV
            echo "BRANCH=main" >> $GITHUB_ENV

        - name: Install Required PHP Extensions
          run: |
            sudo yum install -y php php-cli php-mysqlnd php-pdo php-mbstring php-xml php-bcmath php-gd php-curl php-zip php-sqlite3 unzip git

        - name: Prepare Deployment Directory
          run: |
            sudo mkdir -p $APP_DIR
            sudo chown -R $USER:$USER $APP_DIR

        - name: Clone or Pull Latest Code
          run: |
            if [ ! -d "$APP_DIR/.git" ]; then
              rm -rf $APP_DIR/*
              git clone -b $BRANCH $REPO_URL $APP_DIR
            else
              cd $APP_DIR
              git reset --hard
              git clean -fd
              git pull origin $BRANCH
            fi

        - name: Install Composer Dependencies
          run: |
            cd $APP_DIR
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

        - name: Setup Laravel Environment
          run: |
            cd $APP_DIR

            if [ ! -f .env ]; then
              cp .env.example .env
            fi

            php artisan key:generate --force

        - name: Set Folder Permissions
          run: |
            cd $APP_DIR

            sudo chown -R nginx:nginx storage bootstrap/cache || true
            sudo chmod -R 775 storage bootstrap/cache

        - name: Clear Old Cache
          run: |
            cd $APP_DIR

            php artisan optimize:clear || true
            php artisan config:clear || true
            php artisan cache:clear || true
            php artisan route:clear || true
            php artisan view:clear || true

        - name: Run Database Migration
          run: |
            cd $APP_DIR

            php artisan migrate --force

        - name: Cache Laravel Config
          run: |
            cd $APP_DIR

            php artisan config:cache
            php artisan route:cache || true
            php artisan view:cache || true

        - name: Restart Services
          run: |
            sudo systemctl restart nginx || true
            sudo systemctl restart php-fpm || true

        - name: Deployment Success
          run: |
            echo "Laravel application deployed successfully 🚀"
