name: Laravel CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.2
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath

    - name: Copy .env
      run: cp .env.example .env

    - name: Create SQLite Database
      run: |
        mkdir -p database
        touch database/database.sqlite

    - name: "⚙️ Configure Production Environment"
      run: |
          cd $RELEASE_DIR

          # Create .env from example
          cp .env.example .env

          # ✅ CRITICAL: Force MySQL as the database driver
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env

          # Application settings
          sed -i 's/APP_ENV=.*/APP_ENV=production/' .env
          sed -i 's/APP_DEBUG=.*/APP_DEBUG=false/' .env
          sed -i 's|APP_URL=.*|APP_URL=${{ secrets.APP_URL }}|' .env
          sed -i 's/APP_KEY=.*/APP_KEY=${{ secrets.APP_KEY }}/' .env

          # Database configuration
          sed -i 's/DB_HOST=.*/DB_HOST=${{ secrets.DB_HOST }}/' .env
          sed -i 's/DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=${{ secrets.DB_DATABASE }}/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=${{ secrets.DB_USERNAME }}/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=${{ secrets.DB_PASSWORD }}/' .env

          # Cache, session and queue drivers
          sed -i 's/CACHE_DRIVER=.*/CACHE_DRIVER=redis/' .env
          sed -i 's/SESSION_DRIVER=.*/SESSION_DRIVER=redis/' .env
          sed -i 's/QUEUE_CONNECTION=.*/QUEUE_CONNECTION=redis/' .env

          # ✅ Verify the final .env (for debugging)
          echo "--- Verifying .env DB settings ---"
          grep "^DB_" .env
          echo "----------------------------------"

          echo "✅ Environment configured for production"

    - name: Install Dependencies
      run: composer install --no-interaction --prefer-dist

    - name: Install SQLite PHP extension
      run: |
        sudo apt-get update
        sudo apt-get install -y php-sqlite3

    - name: Generate App Key
      run: php artisan key:generate

    - name: Clear Caches
      run: |
        php artisan config:clear
        php artisan cache:clear
        php artisan route:clear
        php artisan view:clear

    - name: Set Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Run Database Migrations
      run: php artisan migrate --force

    - name: Run Tests
      run: |
        php artisan test | tee test-results.txt

    - name: Upload Test Artifact
      uses: actions/upload-artifact@v4
      with:
        name: laravel-test-results
        path: test-results.txt

  deploy:
    needs: test

    runs-on:
      - self-hosted

    steps:
      - name: Deploy Application
        run: |
            set -e

            APP_DIR="/var/www/auto-clinic"

            echo "Resetting deployment directory..."

            sudo rm -rf "$APP_DIR"
            sudo mkdir -p "$APP_DIR"
            sudo chown -R $USER:$USER "$APP_DIR"

            echo "Cloning repository..."
            git clone https://github.com/mamun-zavisoft/cicd-test-zavisoft.git "$APP_DIR"

            cd "$APP_DIR"

            echo "Installing dependencies..."
            composer install --no-interaction --prefer-dist --optimize-autoloader

            echo "Setting up environment..."
            cp -n .env.example .env || true

            php artisan key:generate || true

            echo "Fixing permissions..."
            chmod -R 775 storage bootstrap/cache

            echo "Running migrations..."
            php artisan migrate --force

            echo "Optimizing Laravel..."
            php artisan optimize:clear
            php artisan optimize

            echo "Deployment Successful 🚀"
