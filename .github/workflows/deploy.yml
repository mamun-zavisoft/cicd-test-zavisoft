name: ZaviSoft CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  PHP_VERSION: "8.2"

jobs:

# ============================================================
# 🧪 TEST JOB
# ============================================================
  test:
    name: "🧪 Run Tests"
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: auto_clinic_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306

        - name: "🧹 Clear Laravel Cache"
          run: |
            php artisan config:clear
            php artisan cache:clear
            php artisan config:cache || true

    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      - name: "🐘 Setup PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, zip, bcmath, fileinfo, openssl, curl
          tools: composer:v2

      - name: "📦 Cache Composer"
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('**/composer.lock') }}

      - name: "📦 Install Dependencies"
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: "🟢 Setup Node"
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "🎨 Build Frontend"
        run: |
          npm ci
          npm run build

      - name: "⏳ Wait for MySQL"
        run: |
          until mysqladmin ping -h 127.0.0.1 -u root -proot_password --silent; do
            echo "Waiting for MySQL..."
            sleep 5
          done

      - name: "🗄️ Run Migrations"
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: auto_clinic_test
          DB_USERNAME: test_user
          DB_PASSWORD: test_password

      - name: "🧪 Run PHPUnit"
        run: |
          mkdir -p storage/test-results

          php artisan test \
            --env=testing \
            --log-junit storage/test-results/junit.xml \
            2>&1 | tee storage/test-results/output.txt

          exit ${PIPESTATUS[0]}
         env:
           DB_CONNECTION: mysql
           DB_HOST: 127.0.0.1
           DB_PORT: 3306
           DB_DATABASE: auto_clinic_test
           DB_USERNAME: test_user
           DB_PASSWORD: test_password
           APP_ENV: testing

      - name: "📤 Upload Test Artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: storage/test-results

# ============================================================
# 🚀 DEPLOY JOB
# ============================================================
  deploy:
    name: "🚀 Deploy to EC2"
    runs-on: [self-hosted, zavisoft, production]
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      - name: "📁 Create Release"
        run: |
          RELEASE_DIR="/var/www/auto-clinic/releases/$(date +%Y%m%d%H%M%S)-${{ github.sha }}"
          echo "RELEASE_DIR=$RELEASE_DIR" >> $GITHUB_ENV

          mkdir -p $RELEASE_DIR
          cp -r $GITHUB_WORKSPACE/. $RELEASE_DIR/

      - name: "📦 Install Production Dependencies"
        run: |
          cd $RELEASE_DIR
          composer install --no-dev --optimize-autoloader --no-interaction

      - name: "⚙️ Setup Production ENV"
        run: |
          cd $RELEASE_DIR
          cp .env.example .env

          sed -i 's/APP_ENV=.*/APP_ENV=production/' .env
          sed -i 's/APP_DEBUG=.*/APP_DEBUG=false/' .env
          sed -i 's|APP_URL=.*|APP_URL=${{ secrets.APP_URL }}|' .env

          sed -i 's/DB_HOST=.*/DB_HOST=${{ secrets.DB_HOST }}/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=${{ secrets.DB_DATABASE }}/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=${{ secrets.DB_USERNAME }}/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=${{ secrets.DB_PASSWORD }}/' .env

          sed -i 's/APP_KEY=.*/APP_KEY=${{ secrets.APP_KEY }}/' .env

      - name: "🔗 Shared Storage Link"
        run: |
          rm -rf $RELEASE_DIR/storage
          ln -nfs /var/www/auto-clinic/shared/storage $RELEASE_DIR/storage

          rm -rf $RELEASE_DIR/bootstrap/cache
          ln -nfs /var/www/auto-clinic/shared/bootstrap/cache $RELEASE_DIR/bootstrap/cache

      - name: "🎯 Laravel Optimize"
        run: |
          cd $RELEASE_DIR
          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan storage:link

      - name: "🔄 Activate Release"
        run: |
          ln -nfs $RELEASE_DIR /var/www/auto-clinic/current

      - name: "🔄 Reload Services"
        run: |
          sudo systemctl reload php8.2-fpm
          sudo systemctl reload nginx

      - name: "🧹 Cleanup Old Releases"
        run: |
          cd /var/www/auto-clinic/releases
          ls -t | tail -n +6 | xargs rm -rf

      - name: "❤️ Health Check"
        run: |
          curl -f http://localhost || exit 1

          echo "Deployment Success 🚀"
          php /var/www/auto-clinic/current/artisan --version
